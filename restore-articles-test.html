<!DOCTYPE html>
<html>
<head>
    <title>Restore Articles</title>
</head>
<body>
    <h1>Article Restoration Tool</h1>
    <button onclick="restoreArticles()">Restore 3 Lost Articles</button>
    <div id="result"></div>
    
    <script>
        async function restoreArticles() {
            try {
                const response = await fetch('https://amebo.org/api/articles/restore', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({}),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('result').innerHTML = `
                        <h2 style="color: green">✅ Success!</h2>
                        <p>Restored ${data.count} articles:</p>
                        <ul>
                            ${data.restored.map(a => `<li>${a.category}: ${a.title}</li>`).join('')}
                        </ul>
                        <p>Articles will appear on the website within 10 seconds.</p>
                    `;
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h2 style="color: red">❌ Error</h2>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
